name: FREE Market News RSS Refresh
on:
  workflow_dispatch:
  schedule:
    # 06:40 Korea time (21:40 UTC preceding day). GitHub may delay schedule.
    - cron: '40 21 * * *'
permissions:
  contents: write
concurrency:
  group: linkprice-market-news-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS headlines for market categories (NO PAID API)
        env:
          MAX_CATS_PER_RUN: '38'
          NEWS_MAX_AGE_DAYS: '35'
        run: python scripts/collect_public_news.py
      - name: Commit public headlines only
        run: |
          if [ -n "$(git status --porcelain -- data/news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "Update public industry RSS headlines"
            git push
          fi
